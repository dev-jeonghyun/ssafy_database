<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 880" role="img" aria-labelledby="class-web-title class-web-desc" id="class-web-root"><title id="class-web-title">Class Diagram / 회원 MVC 계층</title><desc id="class-web-desc">JSP 요청과 JSON API 요청이 동일한 MemberService를 이용합니다.</desc><defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #class-web-root { --paper:#f5f5f5;--ink:#2d3142;--muted:#4f5d75;--soft:#5a6580;--accent:#bf4520;--rule:#bfc0c0 }
      #class-web-root { color: var(--ink); font-family: 'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; }
      #class-web-root .diagram-container { width:100%;overflow-x:auto }
      #class-web-root text { fill:var(--ink);font-family:'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif }
      #class-web-root .diagram-title { font-size:26px;font-weight:600 }
      #class-web-root .name { font-size:18px;font-weight:600 }
      #class-web-root .class-name { font-size:17px;font-weight:600 }
      #class-web-root .sub { font-size:15px;fill:var(--muted) }
      #class-web-root .member { font-family:'Geist Mono', 'Consolas', 'Malgun Gothic', monospace;font-size:13px }
      #class-web-root .label { font-size:13px;fill:var(--soft) }
      #class-web-root .uc { font-size:18px;font-weight:500 }
      @media print {
#class-web-root .diagram-container { overflow-x:visible }
}</style>
    <marker id="class-web-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#4f5d75" stroke-width="1.3"/></marker>
    <marker id="class-web-triangle" markerWidth="15" markerHeight="15" refX="14" refY="7" orient="auto"><path d="M0 0L14 7L0 14Z" fill="#f5f5f5" stroke="#2d3142" stroke-width="1.2"/></marker>
    <marker id="class-web-aggregate" markerWidth="14" markerHeight="12" refX="0" refY="6" orient="auto"><path d="M0 6L6 1L12 6L6 11Z" fill="#f5f5f5" stroke="#2d3142" stroke-width="1.2"/></marker>
    <marker id="class-web-composition" markerWidth="14" markerHeight="12" refX="0" refY="6" orient="auto"><path d="M0 6L6 1L12 6L6 11Z" fill="#2d3142" stroke="#2d3142"/></marker>
    </defs><rect width="1280" height="880" fill="#f5f5f5"/><text x="32" y="42" class="diagram-title" text-anchor="start">Class Diagram / 회원 MVC 계층</text><text x="32" y="72" class="sub" text-anchor="start">JSP 요청과 JSON API 요청이 동일한 MemberService를 이용합니다.</text><path d="M208 260V336Q208 344 216 344H536Q544 344 544 352V440" fill="none" stroke="#4f5d75" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#class-web-arrow)"/><path d="M636 260V440" fill="none" stroke="#4f5d75" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#class-web-arrow)"/><path d="M1064 260V368Q1064 376 1056 376H744Q736 376 736 384V440" fill="none" stroke="#4f5d75" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#class-web-arrow)"/><path d="M888 544H820" fill="none" stroke="#4f5d75" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#class-web-triangle)"/><rect x="32" y="100" width="352" height="160" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1.5"/><text x="208.0" y="131" class="class-name" text-anchor="middle">MemberApiController</text><path d="M32 148H384" stroke="#bfc0c0" stroke-width="1"/><text x="48" y="173" class="member" text-anchor="start">- service: MemberService</text><path d="M32 192H384" stroke="#bfc0c0" stroke-width="1"/><text x="48" y="217" class="member" text-anchor="start"># doGet(request, response): void</text><text x="48" y="241" class="member" text-anchor="start"># doPost(request, response): void</text><rect x="460" y="100" width="360" height="160" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1.5"/><text x="640.0" y="131" class="class-name" text-anchor="middle">MemberController</text><path d="M460 148H820" stroke="#bfc0c0" stroke-width="1"/><text x="476" y="173" class="member" text-anchor="start">- mService: MemberService</text><path d="M460 192H820" stroke="#bfc0c0" stroke-width="1"/><text x="476" y="217" class="member" text-anchor="start"># doGet(request, response): void</text><text x="476" y="241" class="member" text-anchor="start"># doPost(request, response): void</text><rect x="888" y="100" width="360" height="160" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1.5"/><text x="1068.0" y="131" class="class-name" text-anchor="middle">AuthController</text><path d="M888 148H1248" stroke="#bfc0c0" stroke-width="1"/><text x="904" y="173" class="member" text-anchor="start">- mService: MemberService</text><path d="M888 192H1248" stroke="#bfc0c0" stroke-width="1"/><text x="904" y="217" class="member" text-anchor="start"># doGet(request, response): void</text><text x="904" y="241" class="member" text-anchor="start"># doPost(request, response): void</text><rect x="460" y="440" width="360" height="208" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1.5"/><text x="640.0" y="463" class="label" text-anchor="middle">«interface»</text><text x="640.0" y="491" class="class-name" text-anchor="middle">MemberService</text><path d="M460 508H820" stroke="#bfc0c0" stroke-width="1"/><text x="476" y="533" class="member" text-anchor="start">+ registMember(member): int</text><text x="476" y="557" class="member" text-anchor="start">+ login(id, password): Member</text><text x="476" y="581" class="member" text-anchor="start">+ findByLoginId(id): Member</text><text x="476" y="605" class="member" text-anchor="start">+ memberModify(...): Member</text><text x="476" y="629" class="member" text-anchor="start">+ memberDelete(...): boolean</text><rect x="888" y="440" width="360" height="184" rx="6" fill="#f1e5e0" stroke="#bf4520" stroke-width="1.5"/><text x="1068.0" y="471" class="class-name" text-anchor="middle">BasicMemberService</text><path d="M888 488H1248" stroke="#bfc0c0" stroke-width="1"/><text x="904" y="513" class="member" text-anchor="start">- dao: MemberDao</text><path d="M888 532H1248" stroke="#bfc0c0" stroke-width="1"/><text x="904" y="557" class="member" text-anchor="start">+ getService(): BasicMemberService</text><text x="904" y="581" class="member" text-anchor="start">+ registMember(member): int</text><text x="904" y="605" class="member" text-anchor="start">+ memberModify(...): Member</text><text x="32" y="716" class="sub" text-anchor="start">컨트롤러는 HttpServlet을 상속하고 ControllerHelper를 구현합니다. 주요 메서드만 발췌했으며 인자는 축약 표기했습니다.</text><path d="M32 760H1248" stroke="#bfc0c0"/><path d="M40 796H88" stroke="#4f5d75" fill="none" stroke-width="1.5" marker-end="url(#class-web-triangle)"/><text x="100" y="801" class="label" text-anchor="start">상속</text><path d="M240 796H288" stroke="#4f5d75" fill="none" stroke-width="1.5" marker-end="url(#class-web-triangle)" stroke-dasharray="5 4"/><text x="300" y="801" class="label" text-anchor="start">구현</text><path d="M440 796H488" stroke="#4f5d75" fill="none" stroke-width="1.5" marker-start="url(#class-web-composition)"/><text x="500" y="801" class="label" text-anchor="start">합성</text><path d="M640 796H688" stroke="#4f5d75" fill="none" stroke-width="1.5" marker-start="url(#class-web-aggregate)"/><text x="700" y="801" class="label" text-anchor="start">집합</text><path d="M840 796H888" stroke="#4f5d75" fill="none" stroke-width="1.5" marker-end="url(#class-web-arrow)"/><text x="900" y="801" class="label" text-anchor="start">연관</text><path d="M1040 796H1088" stroke="#4f5d75" fill="none" stroke-width="1.5" marker-end="url(#class-web-arrow)" stroke-dasharray="5 4"/><text x="1100" y="801" class="label" text-anchor="start">의존</text><text x="32" y="836" class="sub" text-anchor="start">선은 실제 코드의 관계만 표시합니다. 범례에는 UML 관계 표기를 모두 수록했습니다.</text></svg>

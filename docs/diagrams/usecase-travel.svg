<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 928" role="img" aria-labelledby="usecase-travel-title usecase-travel-desc" id="usecase-travel-root"><title id="usecase-travel-title">Usecase Diagram / 관광과 여행 기록</title><desc id="usecase-travel-desc">시스템 경계 안의 타원은 유스케이스입니다. «actor» 사각형은 UML 액터의 대체 표기입니다.</desc><defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #usecase-travel-root { --paper:#f5f5f5;--ink:#2d3142;--muted:#4f5d75;--soft:#5a6580;--accent:#bf4520;--rule:#bfc0c0 }
      #usecase-travel-root { color: var(--ink); font-family: 'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; }
      #usecase-travel-root .diagram-container { width:100%;overflow-x:auto }
      #usecase-travel-root text { fill:var(--ink);font-family:'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif }
      #usecase-travel-root .diagram-title { font-size:26px;font-weight:600 }
      #usecase-travel-root .name { font-size:18px;font-weight:600 }
      #usecase-travel-root .class-name { font-size:17px;font-weight:600 }
      #usecase-travel-root .sub { font-size:15px;fill:var(--muted) }
      #usecase-travel-root .member { font-family:'Geist Mono', 'Consolas', 'Malgun Gothic', monospace;font-size:13px }
      #usecase-travel-root .label { font-size:13px;fill:var(--soft) }
      #usecase-travel-root .uc { font-size:18px;font-weight:500 }
      @media print {
#usecase-travel-root .diagram-container { overflow-x:visible }
}</style>
    <marker id="usecase-travel-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#4f5d75" stroke-width="1.3"/></marker>
    <marker id="usecase-travel-triangle" markerWidth="15" markerHeight="15" refX="14" refY="7" orient="auto"><path d="M0 0L14 7L0 14Z" fill="#f5f5f5" stroke="#2d3142" stroke-width="1.2"/></marker>
    <marker id="usecase-travel-aggregate" markerWidth="14" markerHeight="12" refX="0" refY="6" orient="auto"><path d="M0 6L6 1L12 6L6 11Z" fill="#f5f5f5" stroke="#2d3142" stroke-width="1.2"/></marker>
    <marker id="usecase-travel-composition" markerWidth="14" markerHeight="12" refX="0" refY="6" orient="auto"><path d="M0 6L6 1L12 6L6 11Z" fill="#2d3142" stroke="#2d3142"/></marker>
    </defs><rect width="1280" height="928" fill="#f5f5f5"/><text x="32" y="42" class="diagram-title" text-anchor="start">Usecase Diagram / 관광과 여행 기록</text><text x="32" y="72" class="sub" text-anchor="start">시스템 경계 안의 타원은 유스케이스입니다. «actor» 사각형은 UML 액터의 대체 표기입니다.</text><rect x="560" y="100" width="528" height="672" rx="8" fill="none" stroke="#bfc0c0"/><text x="580" y="124" class="label" text-anchor="start">EnjoyTrip 관광·기록 기능</text><path d="M280 360H376Q384 360 384 352V184Q384 176 392 176H600" fill="none" stroke="#4f5d75" stroke-width="1.6"/><path d="M280 384H408Q416 384 416 376V288Q416 280 424 280H600" fill="none" stroke="#4f5d75" stroke-width="1.6"/><path d="M280 408H440Q448 408 448 400V392Q448 384 456 384H600" fill="none" stroke="#4f5d75" stroke-width="1.6"/><path d="M280 432H440Q448 432 448 440V480Q448 488 456 488H600" fill="none" stroke="#4f5d75" stroke-width="1.6"/><path d="M280 456H408Q416 456 416 464V584Q416 592 424 592H600" fill="none" stroke="#4f5d75" stroke-width="1.6"/><path d="M280 480H376Q384 480 384 488V688Q384 696 392 696H600" fill="none" stroke="#4f5d75" stroke-width="1.6"/><rect x="32" y="320" width="248" height="216" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1.5"/><text x="156.0" y="354" class="label" text-anchor="middle">«actor»</text><text x="156.0" y="390" class="name" text-anchor="middle">모든 이용자</text><ellipse cx="820" cy="176" rx="220" ry="40" fill="#f5f5f5" stroke="#2d3142" stroke-width="1.5"/><text x="820" y="176" class="uc" text-anchor="middle">지역·콘텐츠별 관광지 조회</text><text x="820" y="198" class="label" text-anchor="middle">F101 · F102 · F103</text><ellipse cx="820" cy="280" rx="220" ry="40" fill="#f5f5f5" stroke="#2d3142" stroke-width="1.5"/><text x="820" y="280" class="uc" text-anchor="middle">관광지 위치·사진 보기</text><text x="820" y="302" class="label" text-anchor="middle">카카오맵 / F112</text><ellipse cx="820" cy="384" rx="220" ry="40" fill="#f5f5f5" stroke="#2d3142" stroke-width="1.5"/><text x="820" y="384" class="uc" text-anchor="middle">여행 계획과 일정 저장</text><text x="820" y="406" class="label" text-anchor="middle">F104 / 브라우저 저장</text><ellipse cx="820" cy="488" rx="220" ry="40" fill="#f5f5f5" stroke="#2d3142" stroke-width="1.5"/><text x="820" y="488" class="uc" text-anchor="middle">여행지 순서 변경·동선 조회</text><text x="820" y="510" class="label" text-anchor="middle">F104 / 드래그 앤 드롭</text><ellipse cx="820" cy="592" rx="220" ry="40" fill="#f5f5f5" stroke="#2d3142" stroke-width="1.5"/><text x="820" y="592" class="uc" text-anchor="middle">사진으로 핫플 기록</text><text x="820" y="614" class="label" text-anchor="middle">F105 / 브라우저 저장</text><ellipse cx="820" cy="696" rx="220" ry="40" fill="#f5f5f5" stroke="#2d3142" stroke-width="1.5"/><text x="820" y="696" class="uc" text-anchor="middle">저장한 계획·핫플 삭제</text><text x="820" y="718" class="label" text-anchor="middle">삭제 확인 후 해당 기록만 삭제</text><path d="M32 800H1248" stroke="#bfc0c0"/><path d="M40 832H92" fill="none" stroke="#4f5d75" stroke-width="1.6"/><text x="108" y="837" class="label" text-anchor="start">연관 / 이용</text><text x="332" y="837" class="label" text-anchor="start">«actor»: 액터 / 타원: 유스케이스</text><text x="760" y="837" class="label" text-anchor="start">구현 기준: 2026-10-30</text><text x="32" y="892" class="sub" text-anchor="start">여행 계획·핫플은 현재 비로그인 상태에서도 이용할 수 있으며, 계정별 서버 저장은 구현하지 않았습니다.</text></svg>

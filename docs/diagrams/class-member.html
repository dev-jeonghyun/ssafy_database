 text-anchor="start">+ Page(condition, total, list)</text><rect x="896" y="500" width="352" height="232" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1.5"/><text x="1072.0" y="531" class="class-name" text-anchor="middle">Member</text><path d="M896 548H1248" stroke="#bfc0c0" stroke-width="1"/><text x="912" y="573" class="member" text-anchor="start">- mno: long</text><text x="912" y="597" class="member" text-anchor="start">- loginId, name: String</text><text x="912" y="621" class="member" text-anchor="start">- role: String</text><text x="912" y="645" class="member" text-anchor="start">- password: String</text><text x="912" y="669" class="member" text-anchor="start">- question, answer: String</text><path d="M896 688H1248" stroke="#bfc0c0" stroke-width="1"/><text x="912" y="713" class="member" text-anchor="start">+ Member(...)</text><text x="32" y="772" class="sub" text-anchor="start">Member 구현은 Serializable입니다. Page&lt;T&gt; → Member 관계는 실제 사용인 Page&lt;Member&gt;를 나타냅니다.</text><path d="M32 808H1248" stroke="#bfc0c0"/><path d="M40 844H88" stroke="#4f5d75" fill="none" stroke-width="1.5" marker-end="url(#triangle)"/><text x="100" y="849" class="label" text-anchor="start">상속</text><path d="M240 844H288" stroke="#4f5d75" fill="none" stroke-width="1.5" marker-end="url(#triangle)" stroke-dasharray="5 4"/><text x="300" y="849" class="label" text-anchor="start">구현</text><path d="M440 844H488" stroke="#4f5d75" fill="none" stroke-width="1.5" marker-start="url(#composition)"/><text x="500" y="849" class="label" text-anchor="start">합성</text><path d="M640 844H688" stroke="#4f5d75" fill="none" stroke-width="1.5" marker-start="url(#aggregate)"/><text x="700" y="849" class="label" text-anchor="start">집합</text><path d="M840 844H888" stroke="#4f5d75" fill="none" stroke-width="1.5" marker-end="url(#arrow)"/><text x="900" y="849" class="label" text-anchor="start">연관</text><path d="M1040 844H1088" stroke="#4f5d75" fill="none" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="5 4"/><text x="1100" y="849" class="label" text-anchor="start">의존</text><text x="32" y="884" class="sub" text-anchor="start">선은 실제 코드의 관계만 표시합니다. 범례에는 UML 관계 표기를 모두 수록했습니다.</text></svg></div><footer>diagram-design 2.6 / 기본 밝은 스타일 / 실제 소스 기준. 외부 웹폰트가 차단되면 로컬 한글 폰트로 표시됩니다.</footer></main></body></html>

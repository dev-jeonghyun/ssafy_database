<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 912" role="img" aria-labelledby="architecture-title architecture-desc" id="architecture-root"><title id="architecture-title">EnjoyTrip 전체 아키텍처</title><desc id="architecture-desc">현재 구현: 회원은 서버·파일 저장, 관광정보는 서버 API 중계, 추가 기능은 브라우저 저장.</desc><defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #architecture-root { --paper:#f5f5f5;--ink:#2d3142;--muted:#4f5d75;--soft:#5a6580;--accent:#bf4520;--rule:#bfc0c0 }
      #architecture-root { color: var(--ink); font-family: 'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; }
      #architecture-root .diagram-container { width:100%;overflow-x:auto }
      #architecture-root text { fill:var(--ink);font-family:'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif }
      #architecture-root .diagram-title { font-size:26px;font-weight:600 }
      #architecture-root .name { font-size:18px;font-weight:600 }
      #architecture-root .class-name { font-size:17px;font-weight:600 }
      #architecture-root .sub { font-size:15px;fill:var(--muted) }
      #architecture-root .member { font-family:'Geist Mono', 'Consolas', 'Malgun Gothic', monospace;font-size:13px }
      #architecture-root .label { font-size:13px;fill:var(--soft) }
      #architecture-root .uc { font-size:18px;font-weight:500 }
      @media print {
#architecture-root .diagram-container { overflow-x:visible }
}</style>
    <marker id="architecture-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#4f5d75" stroke-width="1.3"/></marker>
    <marker id="architecture-triangle" markerWidth="15" markerHeight="15" refX="14" refY="7" orient="auto"><path d="M0 0L14 7L0 14Z" fill="#f5f5f5" stroke="#2d3142" stroke-width="1.2"/></marker>

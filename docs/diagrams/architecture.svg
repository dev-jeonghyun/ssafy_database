    <marker id="architecture-composition" markerWidth="14" markerHeight="12" refX="0" refY="6" orient="auto"><path d="M0 6L6 1L12 6L6 11Z" fill="#2d3142" stroke="#2d3142"/></marker>
    </defs><rect width="1280" height="912" fill="#f5f5f5"/><text x="32" y="42" class="diagram-title" text-anchor="start">EnjoyTrip 전체 아키텍처</text><text x="32" y="72" class="sub" text-anchor="start">현재 구현: 회원은 서버·파일 저장, 관광정보는 서버 API 중계, 추가 기능은 브라우저 저장.</text><rect x="16" y="96" width="368" height="520" rx="8" fill="none" stroke="#bfc0c0" stroke-dasharray="4 4"/><text x="32" y="120" class="label" text-anchor="start">브라우저</text><rect x="456" y="96" width="368" height="520" rx="8" fill="none" stroke="#bfc0c0" stroke-dasharray="4 4"/><text x="472" y="120" class="label" text-anchor="start">Tomcat 웹 계층</text><rect x="896" y="96" width="368" height="740" rx="8" fill="none" stroke="#bfc0c0" stroke-dasharray="4 4"/><text x="912" y="120" class="label" text-anchor="start">Tomcat 회원 계층</text><path d="M368 224H472" fill="none" stroke="#4f5d75" stroke-width="1.6" marker-end="url(#architecture-arrow)"/><path d="M808 224H912" fill="none" stroke="#4f5d75" stroke-width="1.6" marker-end="url(#architecture-arrow)"/><path d="M200 304V408" fill="none" stroke="#4f5d75" stroke-width="1.6" marker-end="url(#architecture-arrow)"/><path d="M640 304V408" fill="none" stroke="#4f5d75" stroke-width="1.6" marker-end="url(#architecture-arrow)"/><path d="M1080 304V408" fill="none" stroke="#4f5d75" stroke-width="1.6" marker-end="url(#architecture-arrow)"/><path d="M640 568V688" fill="none" stroke="#4f5d75" stroke-width="1.6" marker-end="url(#architecture-arrow)"/><path d="M32 256H16Q8 256 8 264V640Q8 648 16 648H192Q200 648 200 656V688" fill="none" stroke="#4f5d75" stroke-width="1.6" marker-end="url(#architecture-arrow)"/><path d="M808 272H856Q864 272 864 280V640Q864 648 872 648H1072Q1080 648 1080 656V688" fill="none" stroke="#4f5d75" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#architecture-arrow)"/><rect x="32" y="144" width="336" height="160" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1.5"/><text x="52" y="184" class="name" text-anchor="start">EnjoyTrip 웹 화면</text><text x="52" y="216" class="sub" text-anchor="start">index.jsp / main.js</text><text x="52" y="242" class="sub" text-anchor="start">지도·계정·커뮤니티 화면</text><rect x="472" y="144" width="336" height="160" rx="6" fill="#f1e5e0" stroke="#bf4520" stroke-width="1.5"/><text x="492" y="184" class="name" text-anchor="start">Servlet 컨트롤러</text><text x="492" y="216" class="sub" text-anchor="start">/member · /auth</text><text x="492" y="242" class="sub" text-anchor="start">/api/member · /api/tour</text><rect x="912" y="144" width="336" height="160" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1.5"/><text x="932" y="184" class="name" text-anchor="start">회원 Service / DAO</text><text x="932" y="216" class="sub" text-anchor="start">MemberService → MemberDao</text><text x="932" y="242" class="sub" text-anchor="start">BasicMemberService / FileMemberDao</text><rect x="32" y="408" width="336" height="160" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1.5"/><text x="52" y="448" class="name" text-anchor="start">localStorage</text><text x="52" y="480" class="sub" text-anchor="start">공지·게시글·댓글 / 여행 계획</text><text x="52" y="506" class="sub" text-anchor="start">핫플과 사진 / 회원별 분리 없음</text><rect x="472" y="408" width="336" height="160" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1.5"/><text x="492" y="448" class="name" text-anchor="start">관광정보 Service / Client</text><text x="492" y="480" class="sub" text-anchor="start">BasicTourService / TourApiClient</text><text x="492" y="506" class="sub" text-anchor="start">조건 검증 · HTTP 요청 · JSON 변환</text><rect x="912" y="408" width="336" height="160" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1.5"/><text x="932" y="448" class="name" text-anchor="start">member.dat</text><text x="932" y="480" class="sub" text-anchor="start">시작 시 로드 / 정상 종료 시 저장</text><text x="932" y="506" class="sub" text-anchor="start">WEB-INF/classes 아래 런타임 파일</text><rect x="32" y="688" width="336" height="128" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1.5" stroke-dasharray="5 4"/><text x="52" y="728" class="name" text-anchor="start">카카오맵</text><text x="52" y="760" class="sub" text-anchor="start">브라우저 JavaScript SDK</text><rect x="472" y="688" width="336" height="128" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1.5" stroke-dasharray="5 4"/><text x="492" y="728" class="name" text-anchor="start">한국관광공사 TourAPI</text><text x="492" y="760" class="sub" text-anchor="start">국문관광정보 KorService2</text><rect x="912" y="688" width="336" height="128" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1.5"/><text x="932" y="728" class="name" text-anchor="start">HttpSession</text><text x="932" y="760" class="sub" text-anchor="start">로그인 사용자 / 복구 검증 상태</text><text x="32" y="864" class="sub" text-anchor="start">실선: 요청·저장 흐름   점선: 서버 세션 의존. 관광공사 인증키는 서버 내부에서만 사용합니다.</text></svg>

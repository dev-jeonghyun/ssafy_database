<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 944" role="img" aria-labelledby="usecase-community-title usecase-community-desc" id="usecase-community-root"><title id="usecase-community-title">Usecase Diagram / 공지와 공유게시판</title><desc id="usecase-community-desc">일반화 화살표는 관리자 ⊇ 회원 ⊇ 방문자의 이용 권한을 뜻합니다.</desc><defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #usecase-community-root { --paper:#f5f5f5;--ink:#2d3142;--muted:#4f5d75;--soft:#5a6580;--accent:#bf4520;--rule:#bfc0c0 }
      #usecase-community-root { color: var(--ink); font-family: 'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; }
      #usecase-community-root .diagram-container { width:100%;overflow-x:auto }
      #usecase-community-root text { fill:var(--ink);font-family:'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif }
      #usecase-community-root .diagram-title { font-size:26px;font-weight:600 }
      #usecase-community-root .name { font-size:18px;font-weight:600 }
      #usecase-community-root .class-name { font-size:17px;font-weight:600 }
      #usecase-community-root .sub { font-size:15px;fill:var(--muted) }
      #usecase-community-root .member { font-family:'Geist Mono', 'Consolas', 'Malgun Gothic', monospace;font-size:13px }
      #usecase-community-root .label { font-size:13px;fill:var(--soft) }
      #usecase-community-root .uc { font-size:18px;font-weight:500 }
      @media print {
#usecase-community-root .diagram-container { overflow-x:visible }
}</style>

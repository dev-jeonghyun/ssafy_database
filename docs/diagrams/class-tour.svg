<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 880" role="img" aria-labelledby="class-tour-title class-tour-desc" id="class-tour-root"><title id="class-tour-title">Class Diagram / 관광정보 API 계층</title><desc id="class-tour-desc">요청 조건 검증과 외부 HTTP·JSON 처리를 분리해 외부 서비스 의존성을 제한합니다.</desc><defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #class-tour-root { --paper:#f5f5f5;--ink:#2d3142;--muted:#4f5d75;--soft:#5a6580;--accent:#bf4520;--rule:#bfc0c0 }
      #class-tour-root { color: var(--ink); font-family: 'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; }
      #class-tour-root .diagram-container { width:100%;overflow-x:auto }
      #class-tour-root text { fill:var(--ink);font-family:'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif }
      #class-tour-root .diagram-title { font-size:26px;font-weight:600 }
      #class-tour-root .name { font-size:18px;font-weight:600 }
      #class-tour-root .class-name { font-size:17px;font-weight:600 }
      #class-tour-root .sub { font-size:15px;fill:var(--muted) }
      #class-tour-root .member { font-family:'Geist Mono', 'Consolas', 'Malgun Gothic', monospace;font-size:13px }
      #class-tour-root .label { font-size:13px;fill:var(--soft) }
      #class-tour-root .uc { font-size:18px;font-weight:500 }
      @media print {
#class-tour-root .diagram-container { overflow-x:visible }
}</style>
    <marker id="class-tour-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#4f5d75" stroke-width="1.3"/></marker>
    <marker id="class-tour-triangle" markerWidth="15" markerHeight="15" refX="14" refY="7" orient="auto"><path d="M0 0L14 7L0 14Z" fill="#f5f5f5" stroke="#2d3142" stroke-width="1.2"/></marker>
    <marker id="class-tour-aggregate" markerWidth="14" markerHeight="12" refX="0" refY="6" orient="auto"><path d="M0 6L6 1L12 6L6 11Z" fill="#f5f5f5" stroke="#2d3142" stroke-width="1.2"/></marker>
    <marker id="class-tour-composition" markerWidth="14" markerHeight="12" refX="0" refY="6" orient="auto"><path d="M0 6L6 1L12 6L6 11Z" fill="#2d3142" stroke="#2d3142"/></marker>
    </defs><rect width="1280" height="880" fill="#f5f5f5"/><text x="32" y="42" class="diagram-title" text-anchor="start">Class Diagram / 관광정보 API 계층</text><text x="32" y="72" class="sub" text-anchor="start">요청 조건 검증과 외부 HTTP·JSON 처리를 분리해 외부 서비스 의존성을 제한합니다.</text><path d="M384 172H464" fill="none" stroke="#4f5d75" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#class-tour-arrow)"/><path d="M896 196H816" fill="none" stroke="#4f5d75" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#class-tour-triangle)"/><path d="M208 236V440" fill="none" stroke="#4f5d75" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#class-tour-arrow)"/><path d="M1072 236V440" fill="none" stroke="#4f5d75" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#class-tour-arrow)"/><path d="M640 212V440" fill="none" stroke="#4f5d75" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#class-tour-arrow)"/><path d="M896 544H816" fill="none" stroke="#4f5d75" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#class-tour-arrow)"/><rect x="32" y="100" width="352" height="136" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1.5"/><text x="208.0" y="131" class="class-name" text-anchor="middle">TourController</text><path d="M32 148H384" stroke="#bfc0c0" stroke-width="1"/><text x="48" y="173" class="member" text-anchor="start">- service: TourService</text><path d="M32 192H384" stroke="#bfc0c0" stroke-width="1"/><text x="48" y="217" class="member" text-anchor="start"># doGet(request, response): void</text><rect x="464" y="100" width="352" height="112" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1.5"/><text x="640.0" y="123" class="label" text-anchor="middle">«interface»</text><text x="640.0" y="151" class="class-name" text-anchor="middle">TourService</text><path d="M464 168H816" stroke="#bfc0c0" stroke-width="1"/><text x="480" y="193" class="member" text-anchor="start">+ query(action, input, key): TourResult</text><rect x="896" y="100" width="352" height="136" rx="6" fill="#f1e5e0" stroke="#bf4520" stroke-width="1.5"/><text x="1072.0" y="131" class="class-name" text-anchor="middle">BasicTourService</text><path d="M896 148H1248" stroke="#bfc0c0" stroke-width="1"/><text x="912" y="173" class="member" text-anchor="start">- client: TourApiClient</text><path d="M896 192H1248" stroke="#bfc0c0" stroke-width="1"/><text x="912" y="217" class="member" text-anchor="start">+ query(action, input, key): TourResult</text><rect x="32" y="440" width="352" height="160" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1.5"/><text x="208.0" y="471" class="class-name" text-anchor="middle">ApiConfig</text><path d="M32 488H384" stroke="#bfc0c0" stroke-width="1"/><text x="48" y="513" class="member" text-anchor="start">- tourApiKey: String</text><text x="48" y="537" class="member" text-anchor="start">- kakaoMapKey: String</text><path d="M32 556H384" stroke="#bfc0c0" stroke-width="1"/><text x="48" y="581" class="member" text-anchor="start">+ load(context): ApiConfig</text><rect x="464" y="440" width="352" height="164" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1.5"/><text x="640.0" y="471" class="class-name" text-anchor="middle">TourResult</text><path d="M464 488H816" stroke="#bfc0c0" stroke-width="1"/><text x="480" y="513" class="member" text-anchor="start">- items: List&lt;Map&lt;String,Object&gt;&gt;</text><text x="480" y="537" class="member" text-anchor="start">- totalCount: int</text><text x="480" y="561" class="member" text-anchor="start">- pageNo: int</text><text x="480" y="585" class="member" text-anchor="start">- numOfRows: int</text><rect x="896" y="440" width="352" height="184" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1.5"/><text x="1072.0" y="471" class="class-name" text-anchor="middle">TourApiClient</text><path d="M896 488H1248" stroke="#bfc0c0" stroke-width="1"/><text x="912" y="513" class="member" text-anchor="start">- http: HttpClient</text><text x="912" y="537" class="member" text-anchor="start">- base: URI</text><path d="M896 556H1248" stroke="#bfc0c0" stroke-width="1"/><text x="912" y="581" class="member" text-anchor="start">+ fetch(operation, params, key): TourResult</text><text x="912" y="605" class="member" text-anchor="start">+ parse(body, page, rows): TourResult</text><text x="32" y="704" class="sub" text-anchor="start">ApiConfig와 TourResult는 Java record입니다. 필드는 private final이며 공개 접근자가 생성됩니다. 키 값은 포함하지 않습니다.</text><path d="M32 760H1248" stroke="#bfc0c0"/><path d="M40 796H88" stroke="#4f5d75" fill="none" stroke-width="1.5" marker-end="url(#class-tour-triangle)"/><text x="100" y="801" class="label" text-anchor="start">상속</text><path d="M240 796H288" stroke="#4f5d75" fill="none" stroke-width="1.5" marker-end="url(#class-tour-triangle)" stroke-dasharray="5 4"/><text x="300" y="801" class="label" text-anchor="start">구현</text><path d="M440 796H488" stroke="#4f5d75" fill="none" stroke-width="1.5" marker-start="url(#class-tour-composition)"/><text x="500" y="801" class="label" text-anchor="start">합성</text><path d="M640 796H688" stroke="#4f5d75" fill="none" stroke-width="1.5" marker-start="url(#class-tour-aggregate)"/><text x="700" y="801" class="label" text-anchor="start">집합</text><path d="M840 796H888" stroke="#4f5d75" fill="none" stroke-width="1.5" marker-end="url(#class-tour-arrow)"/><text x="900" y="801" class="label" text-anchor="start">연관</text><path d="M1040 796H1088" stroke="#4f5d75" fill="none" stroke-width="1.5" marker-end="url(#class-tour-arrow)" stroke-dasharray="5 4"/><text x="1100" y="801" class="label" text-anchor="start">의존</text><text x="32" y="836" class="sub" text-anchor="start">선은 실제 코드의 관계만 표시합니다. 범례에는 UML 관계 표기를 모두 수록했습니다.</text></svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 928" role="img" aria-labelledby="class-member-title class-member-desc" id="class-member-root"><title id="class-member-title">Class Diagram / 회원 저장과 페이징</title><desc id="class-member-desc">파일 DAO의 인터페이스 구현, 회원 목록, 검색 조건과 페이지 결과를 분리했습니다.</desc><defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #class-member-root { --paper:#f5f5f5;--ink:#2d3142;--muted:#4f5d75;--soft:#5a6580;--accent:#bf4520;--rule:#bfc0c0 }
      #class-member-root { color: var(--ink); font-family: 'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; }
      #class-member-root .diagram-container { width:100%;overflow-x:auto }
      #class-member-root text { fill:var(--ink);font-family:'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif }
      #class-member-root .diagram-title { font-size:26px;font-weight:600 }
      #class-member-root .name { font-size:18px;font-weight:600 }
      #class-member-root .class-name { font-size:17px;font-weight:600 }
      #class-member-root .sub { font-size:15px;fill:var(--muted) }
      #class-member-root .member { font-family:'Geist Mono', 'Consolas', 'Malgun Gothic', monospace;font-size:13px }
      #class-member-root .label { font-size:13px;fill:var(--soft) }
      #class-member-root .uc { font-size:18px;font-weight:500 }
      @media print {
#class-member-root .diagram-container { overflow-x:visible }
}</style>
    <marker id="class-member-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#4f5d75" stroke-width="1.3"/></marker>
    <marker id="class-member-triangle" markerWidth="15" markerHeight="15" refX="14" refY="7" orient="auto"><path d="M0 0L14 7L0 14Z" fill="#f5f5f5" stroke="#2d3142" stroke-width="1.2"/></marker>
    <marker id="class-member-aggregate" markerWidth="14" markerHeight="12" refX="0" refY="6" orient="auto"><path d="M0 6L6 1L12 6L6 11Z" fill="#f5f5f5" stroke="#2d3142" stroke-width="1.2"/></marker>
    <marker id="class-member-composition" markerWidth="14" markerHeight="12" refX="0" refY="6" orient="auto"><path d="M0 6L6 1L12 6L6 11Z" fill="#2d3142" stroke="#2d3142"/></marker>
    </defs><rect width="1280" height="928" fill="#f5f5f5"/><text x="32" y="42" class="diagram-title" text-anchor="start">Class Diagram / 회원 저장과 페이징</text><text x="32" y="72" class="sub" text-anchor="start">파일 DAO의 인터페이스 구현, 회원 목록, 검색 조건과 페이지 결과를 분리했습니다.</text><path d="M384 208H464" fill="none" stroke="#4f5d75" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#class-member-arrow)"/><path d="M896 248H816" fill="none" stroke="#4f5d75" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#class-member-triangle)"/><path d="M1072 380V500" fill="none" stroke="#4f5d75" stroke-width="1.6" marker-start="url(#class-member-aggregate)"/><path d="M144 308V500" fill="none" stroke="#4f5d75" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#class-member-arrow)"/><path d="M280 308V404Q280 412 288 412H632Q640 412 640 420V500" fill="none" stroke="#4f5d75" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#class-member-arrow)"/><path d="M464 616H384" fill="none" stroke="#4f5d75" stroke-width="1.6" marker-end="url(#class-member-arrow)"/><rect x="420.0" y="630" width="40" height="22" fill="#f5f5f5"/><text x="440" y="646" class="label" text-anchor="middle">0..*</text><rect x="388.0" y="586" width="24" height="22" fill="#f5f5f5"/><text x="400" y="602" class="label" text-anchor="middle">1</text><path d="M816 640H896" fill="none" stroke="#4f5d75" stroke-width="1.6" marker-end="url(#class-member-arrow)"/><rect x="820.0" y="610" width="40" height="22" fill="#f5f5f5"/><text x="840" y="626" class="label" text-anchor="middle">0..*</text><rect x="852.0" y="654" width="40" height="22" fill="#f5f5f5"/><text x="872" y="670" class="label" text-anchor="middle">0..*</text><rect x="1080.0" y="390" width="24" height="22" fill="#f5f5f5"/><text x="1092" y="406" class="label" text-anchor="middle">1</text><rect x="1080.0" y="466" width="40" height="22" fill="#f5f5f5"/><text x="1100" y="482" class="label" text-anchor="middle">0..*</text><rect x="32" y="100" width="352" height="208" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1.5"/><text x="208.0" y="131" class="class-name" text-anchor="middle">BasicMemberService</text><path d="M32 148H384" stroke="#bfc0c0" stroke-width="1"/><text x="48" y="173" class="member" text-anchor="start">- dao: MemberDao</text><path d="M32 192H384" stroke="#bfc0c0" stroke-width="1"/><text x="48" y="217" class="member" text-anchor="start">+ getService(): BasicMemberService</text><text x="48" y="241" class="member" text-anchor="start">+ search(condition): Page&lt;Member&gt;</text><text x="48" y="265" class="member" text-anchor="start">+ memberModify(...): Member</text><text x="48" y="289" class="member" text-anchor="start">+ memberDelete(...): boolean</text><rect x="464" y="100" width="352" height="208" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1.5"/><text x="640.0" y="123" class="label" text-anchor="middle">«interface»</text><text x="640.0" y="151" class="class-name" text-anchor="middle">MemberDao</text><path d="M464 168H816" stroke="#bfc0c0" stroke-width="1"/><text x="480" y="193" class="member" text-anchor="start">+ insert(member): int</text><text x="480" y="217" class="member" text-anchor="start">+ search(condition): Page&lt;Member&gt;</text><text x="480" y="241" class="member" text-anchor="start">+ findByLoginId(id): Member</text><text x="480" y="265" class="member" text-anchor="start">+ memberModify(member): Member</text><text x="480" y="289" class="member" text-anchor="start">+ memberDelete(id): boolean</text><rect x="896" y="100" width="352" height="280" rx="6" fill="#f1e5e0" stroke="#bf4520" stroke-width="1.5"/><text x="1072.0" y="131" class="class-name" text-anchor="middle">FileMemberDao</text><path d="M896 148H1248" stroke="#bfc0c0" stroke-width="1"/><text x="912" y="173" class="member" text-anchor="start">- dataFile: File</text><text x="912" y="197" class="member" text-anchor="start">- members: List&lt;Member&gt;</text><text x="912" y="221" class="member" text-anchor="start">- instance: FileMemberDao</text><path d="M896 240H1248" stroke="#bfc0c0" stroke-width="1"/><text x="912" y="265" class="member" text-anchor="start">+ getInstance(): FileMemberDao</text><text x="912" y="289" class="member" text-anchor="start">+ insert(member): int</text><text x="912" y="313" class="member" text-anchor="start">+ search(condition): Page&lt;Member&gt;</text><text x="912" y="337" class="member" text-anchor="start">+ updatePassword(...): boolean</text><text x="912" y="361" class="member" text-anchor="start">+ save(): void</text><rect x="32" y="500" width="352" height="232" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1.5"/><text x="208.0" y="531" class="class-name" text-anchor="middle">SearchCondition</text><path d="M32 548H384" stroke="#bfc0c0" stroke-width="1"/><text x="48" y="573" class="member" text-anchor="start">- key: String</text><text x="48" y="597" class="member" text-anchor="start">- word: String</text><text x="48" y="621" class="member" text-anchor="start">- currentPage: int</text><text x="48" y="645" class="member" text-anchor="start">- itemsPerPage: int</text><path d="M32 664H384" stroke="#bfc0c0" stroke-width="1"/><text x="48" y="689" class="member" text-anchor="start">+ getOffset(): int</text><text x="48" y="713" class="member" text-anchor="start">+ hasKeyword(): boolean</text><rect x="464" y="500" width="352" height="232" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1.5"/><text x="640.0" y="531" class="class-name" text-anchor="middle">Page&lt;T&gt;</text><path d="M464 548H816" stroke="#bfc0c0" stroke-width="1"/><text x="480" y="573" class="member" text-anchor="start">- condition: SearchCondition</text><text x="480" y="597" class="member" text-anchor="start">- list: List&lt;T&gt;</text><text x="480" y="621" class="member" text-anchor="start">- totalItems: int</text><text x="480" y="645" class="member" text-anchor="start">- totalPages: int</text><text x="480" y="669" class="member" text-anchor="start">- startPage, endPage: int</text><path d="M464 688H816" stroke="#bfc0c0" stroke-width="1"/><text x="480" y="713" class="member" text-anchor="start">+ Page(condition, total, list)</text><rect x="896" y="500" width="352" height="232" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1.5"/><text x="1072.0" y="531" class="class-name" text-anchor="middle">Member</text><path d="M896 548H1248" stroke="#bfc0c0" stroke-width="1"/><text x="912" y="573" class="member" text-anchor="start">- mno: long</text><text x="912" y="597" class="member" text-anchor="start">- loginId, name: String</text><text x="912" y="621" class="member" text-anchor="start">- role: String</text><text x="912" y="645" class="member" text-anchor="start">- password: String</text><text x="912" y="669" class="member" text-anchor="start">- question, answer: String</text><path d="M896 688H1248" stroke="#bfc0c0" stroke-width="1"/><text x="912" y="713" class="member" text-anchor="start">+ Member(...)</text><text x="32" y="772" class="sub" text-anchor="start">Member 구현은 Serializable입니다. Page&lt;T&gt; → Member 관계는 실제 사용인 Page&lt;Member&gt;를 나타냅니다.</text><path d="M32 808H1248" stroke="#bfc0c0"/><path d="M40 844H88" stroke="#4f5d75" fill="none" stroke-width="1.5" marker-end="url(#class-member-triangle)"/><text x="100" y="849" class="label" text-anchor="start">상속</text><path d="M240 844H288" stroke="#4f5d75" fill="none" stroke-width="1.5" marker-end="url(#class-member-triangle)" stroke-dasharray="5 4"/><text x="300" y="849" class="label" text-anchor="start">구현</text><path d="M440 844H488" stroke="#4f5d75" fill="none" stroke-width="1.5" marker-start="url(#class-member-composition)"/><text x="500" y="849" class="label" text-anchor="start">합성</text><path d="M640 844H688" stroke="#4f5d75" fill="none" stroke-width="1.5" marker-start="url(#class-member-aggregate)"/><text x="700" y="849" class="label" text-anchor="start">집합</text><path d="M840 844H888" stroke="#4f5d75" fill="none" stroke-width="1.5" marker-end="url(#class-member-arrow)"/><text x="900" y="849" class="label" text-anchor="start">연관</text><path d="M1040 844H1088" stroke="#4f5d75" fill="none" stroke-width="1.5" marker-end="url(#class-member-arrow)" stroke-dasharray="5 4"/><text x="1100" y="849" class="label" text-anchor="start">의존</text><text x="32" y="884" class="sub" text-anchor="start">선은 실제 코드의 관계만 표시합니다. 범례에는 UML 관계 표기를 모두 수록했습니다.</text></svg>

t-anchor="start">+ memberModify(...): Member</text><text x="32" y="716" class="sub" text-anchor="start">컨트롤러는 HttpServlet을 상속하고 ControllerHelper를 구현합니다. 주요 메서드만 발췌했으며 인자는 축약 표기했습니다.</text><path d="M32 760H1248" stroke="#bfc0c0"/><path d="M40 796H88" stroke="#4f5d75" fill="none" stroke-width="1.5" marker-end="url(#triangle)"/><text x="100" y="801" class="label" text-anchor="start">상속</text><path d="M240 796H288" stroke="#4f5d75" fill="none" stroke-width="1.5" marker-end="url(#triangle)" stroke-dasharray="5 4"/><text x="300" y="801" class="label" text-anchor="start">구현</text><path d="M440 796H488" stroke="#4f5d75" fill="none" stroke-width="1.5" marker-start="url(#composition)"/><text x="500" y="801" class="label" text-anchor="start">합성</text><path d="M640 796H688" stroke="#4f5d75" fill="none" stroke-width="1.5" marker-start="url(#aggregate)"/><text x="700" y="801" class="label" text-anchor="start">집합</text><path d="M840 796H888" stroke="#4f5d75" fill="none" stroke-width="1.5" marker-end="url(#arrow)"/><text x="900" y="801" class="label" text-anchor="start">연관</text><path d="M1040 796H1088" stroke="#4f5d75" fill="none" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="5 4"/><text x="1100" y="801" class="label" text-anchor="start">의존</text><text x="32" y="836" class="sub" text-anchor="start">선은 실제 코드의 관계만 표시합니다. 범례에는 UML 관계 표기를 모두 수록했습니다.</text></svg></div><footer>diagram-design 2.6 / 기본 밝은 스타일 / 실제 소스 기준. 외부 웹폰트가 차단되면 로컬 한글 폰트로 표시됩니다.</footer></main></body></html>

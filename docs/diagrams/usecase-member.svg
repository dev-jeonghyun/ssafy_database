<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1040" role="img" aria-labelledby="usecase-member-title usecase-member-desc" id="usecase-member-root"><title id="usecase-member-title">Usecase Diagram / 회원과 인증</title><desc id="usecase-member-desc">아이디 로그인, 본인 확인, 세션 유지와 복구 절차를 기존 회원 요구사항에 구체화했습니다.</desc><defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #usecase-member-root { --paper:#f5f5f5;--ink:#2d3142;--muted:#4f5d75;--soft:#5a6580;--accent:#bf4520;--rule:#bfc0c0 }
      #usecase-member-root { color: var(--ink); font-family: 'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; }
      #usecase-member-root .diagram-container { width:100%;overflow-x:auto }
      #usecase-member-root text { fill:var(--ink);font-family:'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif }
      #usecase-member-root .diagram-title { font-size:26px;font-weight:600 }
      #usecase-member-root .name { font-size:18px;font-weight:600 }
      #usecase-member-root .class-name { font-size:17px;font-weight:600 }
      #usecase-member-root .sub { font-size:15px;fill:var(--muted) }
      #usecase-member-root .member { font-family:'Geist Mono', 'Consolas', 'Malgun Gothic', monospace;font-size:13px }
      #usecase-member-root .label { font-size:13px;fill:var(--soft) }
      #usecase-member-root .uc { font-size:18px;font-weight:500 }
      @media print {
#usecase-member-root .diagram-container { overflow-x:visible }
}</style>
